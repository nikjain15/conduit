name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run
      # Runs above as part of the suite. Called out separately so a failing
      # quality floor is legible in the CI log rather than buried among 200
      # unit tests. Needs no API key: both golden sets score real shipped code
      # offline. Floors and the measured baseline are in evals/README.md.
      - name: Eval gate
        run: npx vitest run evals
      - name: Build console
        run: npm run build --workspace @conduit/console
